paper: Class Incremental Learning in Brain-Computer Interfaces
paradigms:
  seed3:
    description: affective BCI / SEED-3
    encoder: Emotion_Net_ln2
    classes: 3
    phases: 2
    initial_classes: 2
    new_classes_per_phase: 1
  mi:
    description: motor imagery / BNCI2014001
    encoder: MI_ADFCNN
    classes: 4
    phases: 3
    initial_classes: 2
    new_classes_per_phase: 1
  benchmark:
    description: SSVEP Benchmark
    encoder: SSVEPFormer
    classes: 40
    phases: 5
    initial_classes: 20
    new_classes_per_phase: 5
paper_baselines:
  replay: [ER, DER, ASER, CLOPS, FastICARL]
  regularization_or_prototype: [EWC, LwF, PASS, IL2A]
  proposed: ADR
repository_extras: [SFT, SI, MAS, DT2W, GR, DERS]
defaults:
  seed: 1
  runs: 3
  epochs: 100
  weight_decay: 0.001
  cf_matrix: false
